<style>

*,*::before,*::after{box-sizing:inherit}

body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15.5px;line-height:1.5}

p{margin:0 0 10px}

.head{padding:18px 0 12px}

button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.btn.small{min-height:34px;padding:5px 11px;font-size:14px}
.btn.danger{border-color:var(--amber);color:var(--amber)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* barra fija: pestañas + balanza */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-block:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:0;background:transparent;border-radius:8px;padding:8px 13px;font-weight:500;color:var(--muted);min-height:38px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.tab:not([aria-selected="true"]):hover{background:var(--brand-soft);color:var(--ink)}
.meter{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;padding:4px 0 10px}
.figs{display:flex;gap:18px;flex-wrap:wrap}
.fig{display:flex;flex-direction:column;line-height:1.15}
.fig b{font-size:20px;font-weight:600}
.fig span{font-size:12.5px;color:var(--muted)}
.fig.be b.pos{color:var(--blue)} .fig.be b.neg{color:var(--amber)} .fig.be b.zero{color:var(--brand)}
.gaugebox{min-width:140px}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.gauge::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:2px;background:var(--ink);opacity:.55}
.gfill{position:absolute;top:0;bottom:0;transition:left .25s,width .25s}
.gfill.pos{background:var(--blue)} .gfill.neg{background:var(--amber)}
.gscale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:2px}
@media(max-width:640px){.meter{grid-template-columns:1fr}}

main{padding:16px 0 60px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.intro{color:var(--muted);max-width:75ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);flex:0 0 auto;margin-top:3px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14.5px}
.msg{color:var(--amber);font-size:14px;margin:10px 0 0;min-height:0}
.msg:empty{display:none}
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.idxbox{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px}

/* selector de días */
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;min-height:38px;font-weight:500;position:relative}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.day .dot{display:none;position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--c-q)}
.day .dot.on{display:block}
.daysec{display:none}.daysec.on{display:block}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.daytotal{font-weight:600}

.meal{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:10px;padding:12px 14px;margin-bottom:12px}

.mealhead small{color:var(--muted);font-weight:400;margin-left:6px}
.mealtot{font-weight:600}
.frow,.arow{display:grid;gap:8px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.frow{grid-template-columns:minmax(130px,.8fr) minmax(190px,1.7fr) 124px 78px 36px}
.arow{grid-template-columns:minmax(190px,1.6fr) 110px 110px 86px 36px}
.unit{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.qtybox{display:flex;flex-direction:column}
.kc{font-weight:600;padding-top:9px;text-align:right}
.kc span{font-weight:400;color:var(--muted);font-size:13px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:40px;font-size:20px;line-height:1;color:var(--muted)}
.x:hover{border-color:var(--amber);color:var(--amber)}
.hint{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-2px}
.hint.warn{color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:5px 9px}
.sub{display:flex;gap:6px;align-items:center;margin-top:6px}
.sub input{max-width:130px}
.coef{padding-top:9px;font-size:13.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.prog{height:10px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:4px 0 2px}
.prog i{display:block;height:100%;background:var(--c-act);width:0}
.prog.over i{background:var(--amber)}

  .panel{break-before:page}.panel:first-of-type{break-before:auto}
  select,input,textarea{border:1px solid #bbb;appearance:none;-webkit-appearance:none;background:#fff}

@media (prefers-reduced-motion: reduce){.gfill{transition:none}}

/* ============ CÁLCULOS ============ */
function rowKcal(r){
  if(r.cat==='_custom') return (+r.ckcal||0)*(+r.qty||0);
  const f=FMAP[r.food]; if(!f) return 0; const q=+r.qty||0;
  return f.u==='r'? q*f.kcal : q/f.q*f.kcal;
}
function actCoef(r){
  const sx=S.alumno.sexo;let cf=0;
  if(r.act==='_manual') cf=+r.coef||0;
  else{const a=AMAP[r.act];if(a)cf=sx==='H'?a.h:a.m;}
  if(S.opts.net) cf=Math.max(0,cf-REST[sx]);
  return cf;
}
function actKcal(r){return (+r.min||0)*(+S.alumno.peso||0)*actCoef(r);}

function calc(){
  const a=S.alumno,peso=+a.peso||0,h=(+a.altura||0)/100;
  let tmb=0,tmbTxt='';const fm=S.opts.formula,Hm=a.sexo==='H';
  if(fm==='fao_p'){
    if(peso>0){tmb=Hm?17.5*peso+651:12.2*peso+746;tmbTxt=Hm?`17,5 × ${nf(peso,1)} + 651`:`12,2 × ${nf(peso,1)} + 746`;}
  }else if(fm==='sch_p'){
    if(peso>0){tmb=Hm?17.686*peso+658.2:13.384*peso+692.6;tmbTxt=Hm?`17,686 × ${nf(peso,1)} + 658,2`:`13,384 × ${nf(peso,1)} + 692,6`;}
  }else if(peso>0&&h>0){
    if(Hm){tmb=16.6*peso+77*h+572;tmbTxt=`16,6 × ${nf(peso,1)} + 77 × ${nf(h,2)} + 572`;}
    else{tmb=7.4*peso+482*h+217;tmbTxt=`7,4 × ${nf(peso,1)} + 482 × ${nf(h,2)} + 217`;}
  }
  const q=tmb/6,days={},tot={ing:0,tmb:0,q:0,act:0,gasto:0,be:0,n:0};
  DAYS.forEach(d=>{
    const meals={};let ing=0;
    MEAL_NAMES.forEach(m=>{const s=S.comidas[d][m].reduce((x,r)=>x+rowKcal(r),0);meals[m]=s;ing+=s;});
    let act=0,min=0;S.act[d].forEach(r=>{act+=actKcal(r);min+=(+r.min||0);});
    const has=ing>0,gasto=tmb+q+act;
    days[d]={meals,ing,act,min,gasto,has,be:has?ing-gasto:null,hasAct:S.act[d].length>0};
    if(has&&tmb>0){tot.n++;tot.ing+=ing;tot.tmb+=tmb;tot.q+=q;tot.act+=act;tot.gasto+=gasto;tot.be+=ing-gasto;}
  });
  return {peso,h,tmb,q,tmbTxt,days,tot,ready:tmb>0};
}

}
function renderActividad(){
  let h=`<div class="card"><h2>Diario de actividad</h2>
  <p class="intro">Apunta cada día las actividades que haces y los minutos que les dedicas. El gasto se calcula así: minutos × tu peso × coeficiente de la Tabla 1. Ejemplo: 25 min andando con 78 kg (chico) → 25 × 78 × 0,069 = 134,55 kcal.</p></div>`;
  h+=dayButtons('a',S.aday);
  DAYS.forEach((d,di)=>{
    const prev=di>0?DAYS[di-1]:null;
    h+=`<div class="daysec${d===S.aday?' on':''}" data-d="${d}" data-kind="a">
      <div class="dayhead"><h3>${d}</h3><div><span class="daytotal">Total ${d.toLowerCase()}: <span data-b="at|${d}">0</span> kcal</span>
      ${S.act[d].length===0&&prev&&S.act[prev].length>0?`<button class="btn small noprint" style="margin-left:10px" data-act="copyact" data-d="${d}">Copiar actividades de ${prev.toLowerCase()}</button>`:''}</div></div>
      <div class="meal" style="border-left-color:var(--c-act)">
        <div data-b="am|${d}" style="font-size:14px;color:var(--muted)"></div>
        <div class="prog" data-prog="${d}"><i></i></div>
        ${S.act[d].length?S.act[d].map((r,i)=>actRow(d,i,r)).join(''):'<div class="empty">Todavía no has apuntado actividades este día.</div>'}
        <button class="btn small noprint" style="margin-top:8px" data-act="addact" data-d="${d}">+ Añadir actividad</button>
      </div></div>`;
  });
  $('#p-actividad').innerHTML=h;
}

/* ============ RENDER: BALANCE / CONCLUSIONES / CONSULTA ============ */
function renderBalance(){
  $('#p-balance').innerHTML=`
  <div class="card"><h2>Balance final</h2>
    <p class="intro">Balance = energía ingerida − energía gastada. El gasto es la suma del metabolismo basal (TMB), la producción de calor (TMB ÷ 6) y la actividad física. Los días sin comidas apuntadas no cuentan en los totales.</p>
    <div class="tw"><table><thead><tr><th>Día</th><th>Aporte de energía</th><th>Metabolismo basal</th><th>Calor</th><th>Actividad</th><th>Gasto total</th><th>Balance</th></tr></thead>
    <tbody id="balRows"></tbody></table></div>
    <p class="intro" style="margin-top:10px;font-size:13.5px">Todas las cantidades en kcal.</p>
  </div>
  <div class="card"><h2>¿Cómo se reparte tu gasto?</h2><div id="distOut"></div></div>
  <div class="card"><h2>Lectura de tu balance</h2><div id="readOut"></div></div>`;
}
function renderConclusiones(){
  const cp=S.comp;
  $('#p-conclusiones').innerHTML=`
  <div class="card"><h2>3.º Qué podrías hacer según tu balance</h2>
    <p class="intro">Usa tu balance medio diario. Si es positivo, calcula qué actividad (tipo y tiempo) lo compensaría. Si es negativo, calcula qué podrías añadir a tu dieta.</p>
    <h3 style="margin:12px 0 6px">Si tu balance es positivo: gastar más</h3>
    <label class="f" style="max-width:460px">Actividad que podrías hacer<select data-act="cact">${actOptions(cp.act,false)}</select></label>
    <div class="res" id="compAct" aria-live="polite"></div>
    <h3 style="margin:18px 0 6px">Si tu balance es negativo: tomar más energía</h3>
    <div class="grid2" style="max-width:700px">
      <label class="f">Categoría<select data-act="ccat">${catOptions(cp.cat).replace(/<option value="_custom"[\s\S]*?<\/option>/,'')}</select></label>
      <label class="f">Alimento<select data-act="cfood" id="cfood">${cp.cat?foodOptions(cp.cat,cp.food):'<option value="">Elige antes la categoría</option>'}</select></label>
    </div>
    <div class="res" id="compFood" aria-live="polite"></div>
    <div class="note" style="margin-top:12px">Son cálculos orientativos. Si tienes dudas sobre tu alimentación o tu peso, habla con un adulto de confianza o con tu médico.</div>
    <label class="f" style="margin-top:12px">Tu propuesta con tus palabras (tipo de actividad, tiempo, qué cambiarías…)
      <textarea data-act="txt" data-p="txt.ej">${esc(S.txt.ej)}</textarea></label>
  </div>
  <div class="card"><h2>4.º Comentario completo de la práctica</h2>
    <div class="grid2" style="grid-template-columns:1fr">
      <label class="f">Tablas y webs que has utilizado<textarea data-act="txt" data-p="txt.tablas">${esc(S.txt.tablas)}</textarea></label>
      <label class="f">Procedimiento que has seguido<textarea data-act="txt" data-p="txt.proc">${esc(S.txt.proc)}</textarea></label>
      <label class="f">Resultados obtenidos<textarea data-act="txt" data-p="txt.res">${esc(S.txt.res)}</textarea></label>
      <label class="f">Fiabilidad de los datos (¿qué errores o aproximaciones hay?)<textarea data-act="txt" data-p="txt.fiab">${esc(S.txt.fiab)}</textarea></label>
      <label class="f">Opinión personal<textarea data-act="txt" data-p="txt.op">${esc(S.txt.op)}</textarea></label>
    </div>
  </div>`;
}
function renderConsulta(filter=''){
  const t=filter.trim().toLowerCase();
  const rows=FOODS.filter(f=>!t||f.name.toLowerCase().includes(t)).map(f=>{
    const c=CATS.find(c=>c.id===f.cat);
    return `<tr><td class="l">${f.warn&&S.opts.avisos?'<span class="warnmark" title="'+esc(f.warn)+'">⚠ </span>':''}${esc(f.name)}</td><td class="l">${esc(c.title)}</td><td>${esc(f.ref)}</td><td>${f.kcal}</td><td class="l"><span class="pill">${c.table==='T2'?'Tabla 2':c.table==='T3'?'Tabla 3':'Complemento'}</span></td></tr>`;
  }).join('');
  if(!$('#p-consulta').dataset.ready){
    const groups=[...new Set(ACTS.map(a=>a.group))];
    $('#p-consulta').dataset.ready='1';
    $('#p-consulta').innerHTML=`
    <div class="card"><h2>Tabla 1 · Gasto energético por actividad</h2>
      <p class="intro">Coeficientes en kcal por kg de peso y minuto.</p>
      <div class="tblscroll"><table><thead><tr><th>Actividad</th><th>Chicos</th><th>Chicas</th></tr></thead><tbody>
      ${groups.map(g=>`<tr class="total"><td colspan="3">${g}</td></tr>`+ACTS.filter(a=>a.group===g).map(a=>`<tr><td>${esc(a.id)}</td><td>${a.h.toFixed(3).replace('.',',')}</td><td>${a.m.toFixed(3).replace('.',',')}</td></tr>`).join('')).join('')}
      </tbody></table></div></div>
    <div class="card"><h2>Tablas 2 y 3 · Valor energético de los alimentos</h2>
      <p class="intro">Fuentes: tablas de la práctica (www.saludenforma.net) más un pequeño complemento aproximado. Los avisos ⚠ marcan valores que conviene contrastar.</p>
      <input class="search" type="search" id="cfilter" data-act="cfilter" placeholder="Buscar alimento…" aria-label="Buscar alimento" style="border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;min-height:40px">
      <div class="tblscroll"><table><thead><tr><th class="l">Alimento</th><th class="l">Categoría</th><th>Cantidad de referencia</th><th>kcal</th><th class="l">Fuente</th></tr></thead><tbody id="foodRows">${rows}</tbody></table></div></div>`;
  }else{ $('#foodRows').innerHTML=rows; }
}

/* ============ PINTAR (cálculos en vivo) ============ */
function bindVal(k){
  const p=k.split('|'),c=C;
  switch(p[0]){
    case 'f':return nf(rowKcal(S.comidas[p[1]][p[2]][+p[3]]));
    case 'mt':return nf(c.days[p[1]].meals[p[2]]);
    case 'dt':return nf(c.days[p[1]].ing);
    case 'a':return nf(actKcal(S.act[p[1]][+p[2]]));
    case 'ax':{const r=S.act[p[1]][+p[2]];const cf=actCoef(r);
      return (+r.min&&c.peso&&cf)?`${nf(+r.min,1)} × ${nf(c.peso,1)} × ${String(+cf.toFixed(3)).replace('.',',')}`:'';}
    case 'at':return nf(c.days[p[1]].act);
    case 'am':{const m=c.days[p[1]].min;
      return m?`Has registrado ${hm(m)} de 24 h${m>1440?' · ¡te has pasado de 24 h!':m<1440?' · te quedan '+hm(1440-m)+' sin apuntar':''}`:'Apunta aquí cómo reparties las 24 horas del día (incluido dormir, si quieres).';}
  }
  return '';
}
function paint(){
  C=calc();
  $$('[data-b]').forEach(el=>{el.textContent=bindVal(el.dataset.b);});
  $$('[data-prog]').forEach(el=>{const m=C.days[el.dataset.prog].min;el.firstElementChild.style.width=Math.min(100,m/14.4)+'%';el.classList.toggle('over',m>1440);});
  $$('[data-dot]').forEach(el=>{const [k,d]=el.dataset.dot.split('|');
    el.classList.toggle('on',k==='c'?C.days[d].has:C.days[d].hasAct);});
  paintMeter();paintIdx();paintBalance();paintComp();paintMsg();
}
function paintMeter(){
  const t=C.tot,n=t.n,be=n?t.be/n:null;
  $('#mIng').textContent=n?nf(t.ing/n):'—';
  $('#mGas').textContent=n?nf(t.gasto/n):'—';
  const b=$('#mBe');b.textContent=n?sg(be):'—';
  b.className=n?(be>0?'pos':be<0?'neg':'zero'):'';
  $('#mBeL').textContent=n?`balance medio (${n} ${n===1?'día':'días'})`:'balance medio';
  const g=$('#gfill');
  if(n){const p=Math.max(-1,Math.min(1,be/1000));
    if(p>=0){g.className='gfill pos';g.style.left='50%';g.style.width=(p*50)+'%';}
    else{g.className='gfill neg';g.style.left=(50+p*50)+'%';g.style.width=(-p*50)+'%';}
  }else{g.style.width='0';}
}
function paintIdx(){
  const el=$('#idx');if(!el)return;
  if(!C.ready){el.innerHTML='<div class="empty">'+(S.opts.formula==='fao_p'||S.opts.formula==='sch_p'?'Escribe tu peso para ver tus índices.':'Escribe tu peso y tu altura para ver tus índices.')+'</div>';return;}
  el.innerHTML=`
   <div class="idxbox"><div class="t">Metabolismo basal (TMB)</div><div class="v">${nf(C.tmb)} <small>kcal/día</small></div><div class="calc">${C.tmbTxt} = ${nf(C.tmb,1)}</div></div>
   <div class="idxbox"><div class="t">Producción de calor</div><div class="v">${nf(C.q)} <small>kcal/día</small></div><div class="calc">TMB ÷ 6 = ${nf(C.tmb,1)} ÷ 6 = ${nf(C.q,1)}</div></div>
   <div class="idxbox"><div class="t">Gasto sin actividad física</div><div class="v">${nf(C.tmb+C.q)} <small>kcal/día</small></div><div class="calc">TMB + calor. La actividad se suma en el apartado 3.</div></div>`;
}
function paintMsg(){
  const el=$('#datosMsg');if(!el)return;const a=S.alumno,m=[];
  if(a.altura&&+a.altura>0&&+a.altura<3)m.push('La altura va en centímetros (por ejemplo, 165), no en metros.');
  if(a.peso&&(+a.peso<20||+a.peso>200))m.push('Revisa el peso: debe estar en kg.');
  if(a.altura&&+a.altura>=3&&(+a.altura<100||+a.altura>230))m.push('Revisa la altura: debe estar en cm.');
  if(a.edad&&(+a.edad<10||+a.edad>18))m.push('La fórmula del metabolismo basal de esta práctica está pensada para personas de 10 a 18 años.');
  el.innerHTML=m.join('<br>');
}
function paintBalance(){
  const body=$('#balRows');if(!body)return;
  const t=C.tot;
  if(!C.ready){body.innerHTML='<tr><td colspan="7" class="l">Primero escribe tu peso y tu altura en «Mis datos».</td></tr>';$('#distOut').innerHTML='';$('#readOut').innerHTML='';return;}
  let h='';
  DAYS.forEach(d=>{const x=C.days[d];
    h+=x.has?`<tr><td>${d}</td><td>${nf(x.ing)}</td><td>${nf(C.tmb)}</td><td>${nf(C.q)}</td><td>${nf(x.act)}</td><td>${nf(x.gasto)}</td><td class="${x.be>0?'pos':x.be<0?'neg':''}">${sg(x.be)}</td></tr>`
      :`<tr><td>${d}</td><td colspan="6" class="l" style="color:var(--muted)">Sin comidas apuntadas</td></tr>`;});
  if(t.n){h+=`<tr class="total"><td>Balance total (${t.n} ${t.n===1?'día':'días'})</td><td>${nf(t.ing)}</td><td>${nf(t.tmb)}</td><td>${nf(t.q)}</td><td>${nf(t.act)}</td><td>${nf(t.gasto)}</td><td>${sg(t.be)}</td></tr>
    <tr class="total"><td>Media diaria</td><td>${nf(t.ing/t.n)}</td><td>${nf(t.tmb/t.n)}</td><td>${nf(t.q/t.n)}</td><td>${nf(t.act/t.n)}</td><td>${nf(t.gasto/t.n)}</td><td>${sg(t.be/t.n)}</td></tr>`;}
  body.innerHTML=h;
  if(!t.n){$('#distOut').innerHTML='<div class="empty">Apunta las comidas de al menos un día para ver el reparto.</div>';$('#readOut').innerHTML='<div class="empty">Aún no hay datos suficientes.</div>';return;}
  const pt=t.tmb/t.gasto*100,pq=t.q/t.gasto*100,pa=t.act/t.gasto*100;
  const seg=(c,v)=>`<div class="${c}" style="width:${v}%">${v>=7?nf(v)+' %':''}</div>`;
  $('#distOut').innerHTML=`
    <div class="legend"><span><i style="background:var(--c-tmb)"></i>Metabolismo basal</span><span><i style="background:#b07d0c"></i>Producción de calor</span><span><i style="background:var(--c-act)"></i>Actividad física</span></div>
    <div><b>Tu semana</b></div><div class="stack">${seg('a',pt)}${seg('b',pq)}${seg('c',pa)}</div>
    <div><b>Referencia en una dieta equilibrada</b></div><div class="stack">${seg('a',65)}${seg('b',10)}${seg('c',25)}</div>
    <p class="intro">Tu actividad física supone un ${nf(pa)} % de tu gasto; la referencia ronda el 25 %.</p>`;
  const be=t.be/t.n,g=t.gasto/t.n,th=g*0.1;
  let txt;
  if(be>th)txt=`Tu balance medio es <b>positivo</b>: según tus registros tomas unas <b>${nf(be)} kcal más</b> de las que gastas cada día (≈ ${nf(be*7)} kcal a la semana).`;
  else if(be<-th)txt=`Tu balance medio es <b>negativo</b>: según tus registros tomas unas <b>${nf(-be)} kcal menos</b> de las que gastas cada día (≈ ${nf(-be*7)} kcal a la semana).`;
  else txt=`Tu balance medio es <b>casi equilibrado</b> (${sg(be)} kcal al día, menos del 10 % de tu gasto).`;
  const days0=DAYS.filter(d=>C.days[d].has&&!C.days[d].hasAct).length;
  $('#readOut').innerHTML=`<p>${txt}</p>
   ${days0?`<div class="note amber">En ${days0} ${days0===1?'día':'días'} con comidas no has apuntado actividad: su gasto en actividad será 0 y el balance saldrá más alto de lo real.</div>`:''}
   <div class="note">Recuerda: son estimaciones groseras. Si tu balance sale muy alto o muy bajo, revisa primero si has apuntado todo (comidas, raciones y actividades) y las unidades. En la adolescencia un balance algo positivo es normal porque el cuerpo está creciendo.</div>`;
}
function paintComp(){
  const a=$('#compAct'),f=$('#compFood');if(!a)return;
  const t=C.tot;
  if(!C.ready||!t.n){const m='Completa tus datos y apunta las comidas de al menos un día para calcularlo.';a.textContent=m;f.textContent=m;return;}
  const be=t.be/t.n;
  if(be<=0)a.textContent='Tu balance medio no es positivo, así que no necesitas gastar más energía para compensarlo.';
  else if(!AMAP[S.comp.act])a.textContent=`Tu balance medio es de ${sg(be)} kcal al día. Elige una actividad para ver cuánto tiempo necesitarías.`;
  else{const cf=actCoef({act:S.comp.act});
    if(!cf||!C.peso)a.textContent='Con esta opción de cálculo, esa actividad no suma gasto extra. Prueba con otra.';
    else{const min=be/(C.peso*cf);
      a.innerHTML=`Para gastar ${nf(be)} kcal al día con <b>${esc(S.comp.act)}</b> necesitarías unos <b>${hm(min)} al día</b> (≈ ${hm(min*7)} a la semana).<br><span style="color:var(--muted);font-size:14px">${nf(be)} ÷ (${nf(C.peso,1)} kg × ${String(+cf.toFixed(3)).replace('.',',')}) = ${nf(min,1)} min</span>`;}}
  if(be>=0)f.textContent='Tu balance medio no es negativo, así que no hace falta añadir energía a tu dieta.';
  else{const fd=FMAP[S.comp.food];
    if(!fd)f.textContent=`Tu balance medio es de ${sg(be)} kcal al día. Elige un alimento para ver cuánto necesitarías.`;
    else{const need=-be;
      const cant=fd.u==='r'?`${nf(need/fd.kcal,1)} raciones (1 ración = ${fd.ref})`:`${nf(need/fd.kcal*fd.q)} ${fd.u}`;
      f.innerHTML=`Para cubrir ${nf(need)} kcal al día con <b>${esc(fd.name)}</b> necesitarías unos <b>${cant}</b>.`;}}
}

/* ============ NAVEGACIÓN ============ */
function go(tab){
  S.tab=tab;
  $$('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+tab));
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===tab));
  window.scrollTo({top:0});
  if(tab==='consulta')renderConsulta($('#cfilter')?$('#cfilter').value:'');
  save();
}
function showDay(kind,d){
  if(kind==='c')S.day=d;else S.aday=d;
  const panel=kind==='c'?'#p-comidas':'#p-actividad';
  $$(panel+' .daysec').forEach(s=>s.classList.toggle('on',s.dataset.d===d));
  $$(panel+' .day').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===d));
  save();
}
function rowOf(el){
  const r=el.closest('.frow,.arow');if(!r)return null;
  if(r.classList.contains('frow'))return S.comidas[r.dataset.d][r.dataset.m][+r.dataset.i];
  return S.act[r.dataset.d][+r.dataset.i];
}
function redoFood(){renderComidas();paint();save();}
function redoAct(){renderActividad();paint();save();}

/* ============ EVENTOS ============ */
let resetArm=null;
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset.d,m=b.dataset.m;
  const keep=()=>{const y=window.scrollY;requestAnimationFrame(()=>window.scrollTo({top:y}));};
  if(a==='tab')go(b.dataset.tab);
  else if(a==='day')showDay(b.dataset.kind,d);
  else if(a==='addfood'){S.comidas[d][m].push({cat:'',food:'',qty:''});redoFood();keep();}
  else if(a==='delfood'){const r=b.closest('.frow');S.comidas[r.dataset.d][r.dataset.m].splice(+r.dataset.i,1);redoFood();keep();}
  else if(a==='copyfood'){const p=DAYS[DAYS.indexOf(d)-1];S.comidas[d]=JSON.parse(JSON.stringify(S.comidas[p]));redoFood();}
  else if(a==='addact'){S.act[d].push({act:'',min:''});redoAct();keep();}
  else if(a==='delact'){const r=b.closest('.arow');S.act[r.dataset.d].splice(+r.dataset.i,1);redoAct();keep();}
  else if(a==='copyact'){const p=DAYS[DAYS.indexOf(d)-1];S.act[d]=JSON.parse(JSON.stringify(S.act[p]));redoAct();}
  else if(a==='print'){try{window.print();}catch(err){alert('Usa la opción Imprimir de tu navegador (Ctrl+P).');}}
  else if(a==='reset'){
    if(!resetArm){b.textContent='¿Seguro? Pulsa otra vez';resetArm=setTimeout(()=>{resetArm=null;b.textContent='Borrar todo';},4000);}
    else{clearTimeout(resetArm);resetArm=null;b.textContent='Borrar todo';S=blank();try{localStorage.removeItem(KEY);}catch(err){}initAll();}
  }
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;if(!a)return;
  if(a==='fcat'){const r=rowOf(t);r.cat=t.value;r.food='';r.qty='';redoFood();}
  else if(a==='ffood'){const r=rowOf(t);r.food=t.value;const f=FMAP[t.value];r.qty=f?(f.u==='r'?1:f.q):'';redoFood();}
  else if(a==='aact'){const r=rowOf(t);r.act=t.value;if(!r.min)r.min='';redoAct();}
  else if(a==='cact'){S.comp.act=t.value;paint();save();}
  else if(a==='ccat'){S.comp.cat=t.value;S.comp.food='';$('#cfood').innerHTML=t.value?foodOptions(t.value,''):'<option value="">Elige antes la categoría</option>';paint();save();}
  else if(a==='cfood'){S.comp.food=t.value;paint();save();}
});
document.addEventListener('input',e=>{
  const t=e.target,a=t.dataset.act;if(!a)return;
  if(a==='in'){
    const v=t.type==='checkbox'?t.checked:t.value;setPath(t.dataset.p,v);
    if(t.dataset.p==='alumno.sexo'||t.dataset.p==='opts.net'||t.dataset.p==='opts.formula'||t.dataset.p==='opts.avisos'){
      renderComidas();renderActividad();renderConclusiones();if($('#p-consulta').dataset.ready)renderConsulta($('#cfilter').value);
    }
    paint();save();
  }
  else if(a==='fqty'){rowOf(t).qty=t.value;paint();save();}
  else if(a==='cname'){rowOf(t).cname=t.value;save();}
  else if(a==='ckcal'){rowOf(t).ckcal=t.value;paint();save();}
  else if(a==='amin'){rowOf(t).min=t.value;paint();save();}
  else if(a==='aname'){rowOf(t).name=t.value;save();}
  else if(a==='acoef'){rowOf(t).coef=t.value;paint();save();}
  else if(a==='txt'){setPath(t.dataset.p,t.value);save();}
  else if(a==='cfilter'){renderConsulta(t.value);}
});

/* ============ ARRANQUE ============ */
function initAll(){
  renderDatos();renderComidas();renderActividad();renderBalance();renderConclusiones();
  paint();go(S.tab||'datos');
}
initAll();
</script>
